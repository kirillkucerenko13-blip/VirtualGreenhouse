<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" type="image/png" href="/image/icon-leave.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>VirtualGreenhouse</title>
  </head>
  <body>
    <main>
      <!-- Left section (title and btn) -->
      <div class="section-one">
        <div class="section-menu">
          <h1 class="title"><span>My</span> Garden</h1>
          <img class="water" src="image/icon-water.png" alt="water" />
        </div>
        <!-- Right section two btn for sorted and plants -->
        <div class="section-garden">
          <!-- Sort -->
          <div class="sort-system">
            <img class="sort" src="image/icon-sort.png" alt="sort" />
            <img class="dried" src="image/icon-dry.png" />
          </div>
          <!-- My plants(grid) -->
          <div class="grid-garden">
            <div id="plant1" class="plants">
              <img class="plant-img" src="image/Monstera.png" />
              <img class="img-dried" src="image/icon-dry.png" />
              <h3 class="plant-title">Monstera</h3>
              <p class="plant-info">Water every 5 days</p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
